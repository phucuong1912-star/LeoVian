<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Leovian — Website Prototype</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0D0D0D;
            --bg2: #171717;
            --g: #C8A66A;
            --g2: #E2C58E;
            --t: #F5F0E8;
            --t2: #BDB5AA;
            --ln: #3a3226;
            color-scheme: dark
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 90px
        }

        body {
            background: var(--bg);
            color: var(--t);
            font: 16px/1.65 Inter, system-ui, sans-serif;
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        h1,
        h2,
        h3,
        blockquote {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 500;
            line-height: 1.15
        }

        a {
            color: inherit;
            text-decoration: none
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer
        }

        :focus-visible {
            outline: 2px solid var(--g2);
            outline-offset: 3px
        }

        #nav {
            position: fixed;
            inset: 0 0 auto;
            z-index: 20;
            background: #0D0D0DEB;
            border-bottom: 1px solid var(--ln);
            padding: env(safe-area-inset-top, 0px) 5vw 0;
            height: calc(68px + env(safe-area-inset-top, 0px));
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .logo {
            font: 600 22px 'Cormorant Garamond', serif;
            letter-spacing: .3em;
            color: var(--g2)
        }

        .nl {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 13px
        }

        .nl>a,
        .dd>a {
            position: relative;
            padding: 8px 0;
            color: var(--t2)
        }

        .nl>a::after,
        .dd>a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            height: 1px;
            width: 0;
            background: var(--g);
            transition: width .3s
        }

        .nl>a:hover,
        .dd>a:hover,
        .cur {
            color: var(--t) !important
        }

        .nl>a:hover::after,
        .dd>a:hover::after,
        .cur::after {
            width: 100%
        }

        .dd {
            position: relative
        }

        .menu {
            display: none;
            position: absolute;
            top: 100%;
            left: -20px;
            background: var(--bg2);
            border: 1px solid var(--ln);
            padding: 20px 24px;
            gap: 36px;
            min-width: 420px
        }

        .dd:hover .menu,
        .dd:focus-within .menu {
            display: flex
        }

        .menu b {
            display: block;
            color: var(--g);
            font: 500 12px Inter;
            letter-spacing: .15em;
            text-transform: uppercase;
            margin-bottom: 8px
        }

        .menu a {
            display: block;
            padding: 4px 0;
            color: var(--t2)
        }

        .menu a:hover {
            color: var(--g2)
        }

        .lg button {
            background: none;
            border: 0;
            color: var(--t2);
            padding: 10px 8px;
            min-width: 44px;
            min-height: 44px
        }

        .lg .on {
            color: var(--g2);
            border-bottom: 1px solid var(--g)
        }

        .mb {
            display: none;
            background: none;
            border: 1px solid var(--ln);
            padding: 10px 14px;
            min-height: 44px
        }

        .lab {
            font-size: 12px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--g)
        }

        .sec {
            padding: 96px 5vw
        }

        .alt {
            background: var(--bg2)
        }

        .in {
            max-width: 1180px;
            margin: 0 auto
        }

        h2 {
            font-size: clamp(2rem, 4vw, 3.2rem);
            margin: 10px 0 20px
        }

        h3 {
            font-size: 1.6rem;
            margin-bottom: 6px
        }

        p {
            color: var(--t2);
            max-width: 62ch
        }

        .btn {
            border: 1px solid var(--g);
            background: none;
            color: var(--g2);
            padding: 12px 26px;
            letter-spacing: .1em;
            text-transform: uppercase;
            font-size: 13px;
            transition: .25s;
            display: inline-block
        }

        .btn:hover {
            background: var(--g);
            color: #0D0D0D
        }

        .g2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
            gap: 24px;
            margin-top: 36px
        }

        .g4 {
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr))
        }

        .card {
            background: var(--bg2);
            border: 1px solid var(--ln);
            transition: border-color .3s;
            overflow: hidden
        }

        .alt .card {
            background: var(--bg)
        }

        .card:hover,
        .card:focus-visible {
            border-color: var(--g)
        }

        .card .b {
            padding: 22px
        }

        .card .ph {
            aspect-ratio: 16/10;
            transition: transform .3s
        }

        .card:hover .ph {
            transform: scale(1.04)
        }

        .card>div:first-child {
            overflow: hidden
        }

        .ph {
            position: relative;
            background: radial-gradient(circle at 30% 30%, #2b2418, #161411 70%)
        }

        .pt {
            background: radial-gradient(circle at 50% 36%, #3a3020 0 13%, #0000 13.5%), radial-gradient(ellipse at 50% 100%, #3a3020 0 38%, #0000 38.5%), #171717
        }

        [data-l]::after {
            display: none;
            content: attr(data-l);
            position: absolute;
            left: 10px;
            bottom: 10px;
            z-index: 5;
            font-size: 10px;
            letter-spacing: .08em;
            color: var(--g2);
            background: #0D0D0DD9;
            border: 1px dashed var(--g);
            padding: 3px 7px
        }

        .notes [data-l]::after {
            display: block
        }

        .hero {
            position: relative;
            height: 100svh;
            min-height: 600px;
            overflow: hidden;
            background: var(--bg)
        }

        .sc {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.2s;
            overflow: hidden
        }

        .sc.on {
            opacity: 1
        }

        .sc i {
            position: absolute;
            inset: -6%;
            animation: kb 7s ease-in-out infinite alternate
        }

        .sc::after {
            top: 84px;
            bottom: auto;
            left: auto;
            right: 10px
        }

        @keyframes kb {
            to {
                transform: scale(1.1) translate(-2%, -1.5%)
            }
        }

        @keyframes fill {
            from {
                width: 0
            }

            to {
                width: 100%
            }
        }

        .ov {
            position: absolute;
            inset: 0;
            background: #0D0D0D8C
        }

        .ov::after {
            top: 84px;
            bottom: auto
        }

        .hc {
            position: absolute;
            left: 5vw;
            right: 5vw;
            bottom: 190px;
            max-width: 780px
        }

        .hc h1 {
            font-size: clamp(1.9rem, 4.6vw, 3.8rem);
            margin: 14px 0
        }

        .hc h1+h2 {
            font: italic 500 clamp(1.4rem, 2.6vw, 2rem) 'Cormorant Garamond', serif;
            color: var(--g2);
            margin: 0 0 14px
        }

        .hc p {
            margin-bottom: 24px;
            color: var(--t)
        }

        .pb {
            position: absolute;
            left: 5vw;
            right: 5vw;
            bottom: calc(26px + env(safe-area-inset-bottom, 0px))
        }

        .cap {
            font-size: 13px;
            color: var(--t2);
            margin-bottom: 12px;
            min-height: 1.6em
        }

        .pr {
            display: flex;
            gap: 14px;
            align-items: flex-start
        }

        .pi {
            flex: 1;
            background: none;
            border: 0;
            text-align: left;
            padding: 0;
            color: var(--t2);
            font-size: 12px;
            letter-spacing: .08em
        }

        .pi u {
            display: block;
            height: 2px;
            background: var(--ln);
            margin-bottom: 8px;
            position: relative
        }

        .pi u::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 2px;
            width: 0;
            background: var(--g)
        }

        .pi.on {
            color: var(--g2)
        }

        .pi.on u::after {
            animation: fill 6s linear forwards
        }

        .paused .pi.on u::after {
            animation: none;
            width: 100%
        }

        .pi b {
            display: none;
            font-weight: 400
        }

        .pp {
            background: none;
            border: 1px solid var(--ln);
            padding: 2px 10px;
            font-size: 12px
        }

        .cr {
            overflow: hidden;
            position: relative
        }

        .tr {
            display: flex;
            transition: transform .8s ease
        }

        .sl {
            min-width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 70vh;
            background: var(--bg2)
        }

        .sl .ph {
            min-height: 340px
        }

        .sl .tx {
            padding: 6vw;
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        blockquote {
            font-size: clamp(1.5rem, 2.6vw, 2.2rem);
            color: var(--t);
            margin: 18px 0 26px
        }

        .nm {
            color: var(--g2);
            font-size: 1.05rem
        }

        .rl {
            color: var(--t2);
            font-size: 13px;
            letter-spacing: .1em
        }

        .cc {
            position: absolute;
            right: 5vw;
            bottom: 24px;
            display: flex;
            gap: 8px;
            z-index: 6
        }

        .cc button {
            background: var(--bg);
            border: 1px solid var(--g);
            width: 44px;
            height: 44px;
            color: var(--g2)
        }

        .cc button:hover {
            background: var(--g);
            color: #0D0D0D
        }

        .pn {
            position: relative;
            display: block;
            width: 100%;
            text-align: left;
            min-height: 420px;
            border: 1px solid var(--ln);
            background: none;
            overflow: hidden;
            padding: 0
        }

        .pn .ph {
            position: absolute;
            inset: 0;
            transition: transform .8s
        }

        .pn:hover .ph {
            transform: scale(1.05)
        }

        .pn:hover,
        .pn:focus-visible {
            border-color: var(--g)
        }

        .pn .tx {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 30px;
            background: #0D0D0DCC
        }

        .cols {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
            gap: 40px;
            margin-top: 36px
        }

        .cols>div {
            border-top: 1px solid var(--g);
            padding-top: 18px
        }

        label {
            display: block;
            margin-bottom: 14px;
            color: var(--t2);
            font-size: 13px;
            letter-spacing: .05em
        }

        input,
        select,
        textarea {
            width: 100%;
            margin-top: 6px;
            background: var(--bg);
            border: 1px solid var(--ln);
            color: var(--t);
            padding: 12px;
            font: inherit
        }

        .alt input,
        .alt select,
        .alt textarea {
            background: var(--bg2)
        }

        .ok {
            border: 1px solid var(--g);
            padding: 20px;
            color: var(--g2)
        }

        dialog {
            background: var(--bg2);
            color: var(--t);
            border: 1px solid var(--g);
            max-width: 520px;
            width: 90%;
            padding: 28px;
            margin: auto
        }

        dialog::backdrop {
            background: #000000B3
        }

        .fl {
            position: fixed;
            z-index: 15;
            bottom: calc(18px + env(safe-area-inset-bottom, 0px))
        }

        .talk {
            right: 18px;
            min-height: 44px;
            background: var(--g);
            color: #0D0D0D;
            border: 0;
            padding: 12px 20px;
            font-size: 13px;
            letter-spacing: .06em
        }

        .nt {
            left: 18px;
            background: var(--bg2);
            border: 1px solid var(--ln);
            padding: 12px;
            min-height: 44px;
            font-size: 12px;
            color: var(--t2)
        }

        footer {
            padding: 40px 5vw;
            border-top: 1px solid var(--ln);
            font-size: 13px;
            color: var(--t2)
        }

        @media(max-width:1080px) {
            .mb {
                display: block
            }

            .nl {
                display: none;
                position: absolute;
                top: calc(68px + env(safe-area-inset-top, 0px));
                left: 0;
                right: 0;
                background: var(--bg2);
                flex-direction: column;
                align-items: flex-start;
                padding: 20px 5vw;
                max-height: 80vh;
                overflow: auto
            }

            #nav.open .nl {
                display: flex
            }

            .nl>a,
            .dd>a,
            .menu a {
                padding: 12px 0
            }

            .menu {
                display: block;
                position: static;
                min-width: 0;
                border: 0;
                padding: 6px 0 0 12px
            }

            .dd:hover .menu {
                display: block
            }

            .sl {
                grid-template-columns: 1fr
            }

            .hc {
                bottom: 200px
            }

            .pi span {
                display: block
            }

            .sec {
                padding: 72px 5vw
            }
        }

        @media(prefers-reduced-motion:reduce) {

            .sc i,
            .lp i,
            .tr,
            .card .ph,
            .pn .ph {
                animation: none;
                transition: none
            }

            html {
                scroll-behavior: auto
            }

            .pi.on u::after {
                animation: none;
                width: 100%
            }
        }

        .lw {
            position: relative;
            overflow: hidden;
            isolation: isolate
        }

        .lw::before {
            content: '';
            position: absolute;
            inset: 0;
            background: #0D0D0DA6;
            z-index: -1
        }

        .lp {
            position: absolute;
            inset: 0;
            z-index: -2
        }

        .lp i {
            position: absolute;
            inset: -8%;
            animation: kb 8s ease-in-out infinite alternate
        }

        .lp1 i {
            background: radial-gradient(ellipse at 30% 40%, #4a3818, #0D0D0D 75%)
        }

        .lp2 i {
            background: radial-gradient(ellipse at 65% 45%, #3b2a1c, #0D0D0D 75%);
            animation-name: kb2
        }

        .lp3 i {
            background: radial-gradient(ellipse at 50% 60%, #2f3020, #0D0D0D 75%);
            animation-name: kb3
        }

        @keyframes kb2 {
            from {
                transform: scale(1.1)
            }

            to {
                transform: scale(1) translate(2%, 1%)
            }
        }

        @keyframes kb3 {
            to {
                transform: translate(-4%, 0) scale(1.08)
            }
        }

        .hd {
            padding: 150px 5vw 90px
        }

        .hd h1 {
            font-size: clamp(2.2rem, 5vw, 4rem);
            margin-bottom: 12px
        }

        .sb {
            font: italic 500 clamp(1.3rem, 2.4vw, 1.9rem) 'Cormorant Garamond', serif;
            color: var(--g2);
            margin-bottom: 14px;
            max-width: none
        }

        .band {
            padding: 110px 5vw;
            min-height: 48vh;
            display: flex;
            align-items: center
        }

        .band .in {
            width: 100%
        }

        .band h2 {
            font-size: clamp(2.4rem, 5vw, 4.2rem)
        }

        .hero.lw .hc h1+h2 {
            margin-top: 0
        }

        .lp svg {
            width: 100%;
            height: 100%;
            display: block
        }

        .hm::before {
            background: #0D0D0D80
        }

        .bd {
            transform-box: fill-box;
            transform-origin: bottom;
            animation: grow 9s ease-in-out infinite
        }

        @keyframes grow {
            0% {
                transform: scaleY(0)
            }

            30%,
            85% {
                transform: scaleY(1)
            }

            100% {
                transform: scaleY(0)
            }
        }

        .ln1 {
            stroke-dasharray: 2000;
            animation: draw 9s ease-in-out infinite
        }

        @keyframes draw {
            0% {
                stroke-dashoffset: 2000
            }

            50%,
            90% {
                stroke-dashoffset: 0
            }

            100% {
                stroke-dashoffset: 2000
            }
        }

        .fg {
            animation: bob 5s ease-in-out infinite alternate
        }

        @keyframes bob {
            to {
                transform: translateY(-24px)
            }
        }

        .rp {
            transform-box: fill-box;
            transform-origin: center;
            animation: rip 6.6s ease-out infinite
        }

        @keyframes rip {
            from {
                transform: scale(.6);
                opacity: .8
            }

            to {
                transform: scale(2.6);
                opacity: 0
            }
        }

        .sun {
            animation: sunr 8s ease-in-out infinite alternate
        }

        @keyframes sunr {
            from {
                transform: translateY(70px)
            }

            to {
                transform: translateY(0)
            }
        }

        .lk,
        .lk2 {
            animation: lk 6s ease-in-out infinite alternate
        }

        .lk2 {
            animation-name: lk2
        }

        @keyframes lk {
            from {
                transform: translateX(-46px)
            }

            to {
                transform: translateX(0)
            }
        }

        @keyframes lk2 {
            from {
                transform: translateX(46px)
            }

            to {
                transform: translateX(0)
            }
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(22px)
            }
        }

        .hero .hc>* {
            animation: rise .9s both
        }

        .hero .hc>:nth-child(2) {
            animation-delay: .15s
        }

        .hero .hc>:nth-child(3) {
            animation-delay: .3s
        }

        .hero .hc>:nth-child(4) {
            animation-delay: .45s
        }

        .hero .hc>:nth-child(5) {
            animation-delay: .6s
        }

        .rv {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity .8s, transform .8s
        }

        .rv.on2 {
            opacity: 1;
            transform: none
        }

        @media(prefers-reduced-motion:reduce) {

            .bd,
            .fg,
            .rp,
            .sun,
            .lk,
            .lk2,
            .hero .hc>* {
                animation: none
            }

            .ln1 {
                animation: none;
                stroke-dashoffset: 0
            }

            .rv {
                opacity: 1;
                transform: none;
                transition: none
            }
        }
    </style>
</head>

        V.events = () => hd(L('EVENTS', 'SỰ KIỆN'), L('Connect. Collaborate. Grow Together.', 'Gặp gỡ. Kết nối. Cùng phát triển.'), L('Discover events, networking opportunities, and collaborative experiences with Leovian across Australia and Vietnam.', 'Khám phá những sự kiện, hoạt động kết nối và cơ hội hợp tác cùng Leovian tại Úc và Việt Nam.'), 3) + `<section class="sec"><div class="in"><span class="lab">${L('UPCOMING EVENTS', 'SỰ KIỆN SẮP DIỄN RA')}</span><p style="margin-top:8px">${L('Stay informed about upcoming events and networking opportunities.', 'Cập nhật những sự kiện và chương trình kết nối sắp tới.')}</p><div class="g2">${[0, 1, 2].map(i => evc(i)).join('')}</div></div></section><section class="sec alt"><div class="in"><span class="lab">${L('PAST EVENTS', 'SỰ KIỆN ĐÃ DIỄN RA')}</span><p style="margin-top:8px">${L('Explore memorable moments, highlights, and activities from Leovian’s events and collaborations. (Demonstration data only.)', 'Nhìn lại những dấu ấn, khoảnh khắc và hoạt động nổi bật của Leovian cùng các đối tác. (Chỉ là dữ liệu minh họa.)')}</p><div class="g2">${[3, 4, 5].map(i => evc(i, 1)).join('')}</div></div></section>`;

        V.news = () => hd(L('NEWS &amp; INSIGHTS', 'TIN TỨC &amp; GÓC NHÌN'), L('Follow the Leovian Journey.', 'Cập nhật hành trình Leovian.'), L('Projects, activities and new milestones.', 'Dự án, hoạt động và những dấu mốc mới.'), 1) + `<section class="sec"><div class="in"><p>${L('Placeholder layout. No real articles have been written yet.', 'Bố cục minh họa. Chưa có bài viết thật.')}</p><div class="g2">${[0, 1, 2].map(i => `<article class="card" tabindex="0"><div>${ph('NEWS — ARTICLE COVER', ['#4a3818', '#3b2a1c', '#2f3020'][i])}</div><div class="b"><h3>[${L('Placeholder article title', 'Tiêu đề bài viết minh họa')}]</h3><p>[${L('Short summary placeholder', 'Tóm tắt minh họa')}]</p></div></article>`).join('')}</div></div></section>`;
        V.startuplab = () => hd(L('STARTUP LAB', 'KHÔNG GIAN KHỞI NGHIỆP'), L('Where Ideas Begin. Where Potential Grows.', 'Nơi ý tưởng bắt đầu. Nơi tiềm năng phát triển.'), L('Startup Lab is a space for connecting ideas, sharing knowledge, and exploring growth opportunities within the entrepreneurial communities of Australia and Vietnam.', 'Startup Lab là không gian kết nối ý tưởng, chia sẻ kiến thức và khám phá cơ hội phát triển dành cho cộng đồng khởi nghiệp tại Úc và Việt Nam.'), 2) + ph('STARTUP LAB — REAL TEAM BRAINSTORMING PHOTO', '#4a3818').replace('class="ph"', 'class="ph" style="height:40vh;min-height:260px"') + `<section class="sec"><div class="in"><div class="cols" style="margin-top:0">${[['IDEAS &amp; DISCUSSIONS', 'Ý TƯỞNG &amp; THẢO LUẬN', 'Share ideas, exchange perspectives, and explore new business opportunities.', 'Nơi chia sẻ ý tưởng, trao đổi góc nhìn và khám phá những cơ hội kinh doanh mới.'], ['KNOWLEDGE &amp; RESOURCES', 'KIẾN THỨC &amp; TÀI NGUYÊN', 'Discover practical insights, experiences, and resources to support your entrepreneurial journey.', 'Chia sẻ kiến thức, kinh nghiệm thực tiễn và tài liệu hữu ích cho hành trình khởi nghiệp.'], ['STARTUP STORIES', 'CÂU CHUYỆN KHỞI NGHIỆP', 'Explore entrepreneurial journeys, experiences, and lessons from founders and business communities.', 'Khám phá những hành trình, trải nghiệm và bài học từ cộng đồng doanh nhân và nhà sáng lập.']].map(x => `<div><h3 style="font-size:1.25rem;letter-spacing:.04em">${L(x[0], x[1])}</h3><p>${L(x[2], x[3])}</p></div>`).join('')}</div></div></section><section class="sec alt" id="idea"><div class="in" style="max-width:640px"><span class="lab">${L('CONNECT WITH US', 'KẾT NỐI CÙNG LEOVIAN')}</span><h2>${L('Have a business idea or looking to connect with the startup community?', 'Bạn có một ý tưởng kinh doanh hoặc mong muốn kết nối với cộng đồng khởi nghiệp?')}</h2><p style="margin-bottom:24px">${L('Prototype form: nothing is sent.', 'Biểu mẫu minh họa: không có dữ liệu nào được gửi.')}</p>${frm(F(L('Full Name', 'Họ và tên'), 'n') + F('Email', 'e', 'email') + `<label>${L('Your idea', 'Ý tưởng của bạn')}<textarea rows="4" required></textarea></label>`, L('Share Your Idea', 'Chia sẻ ý tưởng'))}</div></section>`;
        V.contact = () => hd(L('CONTACT', 'LIÊN HỆ'), L('Start a Conversation. Explore New Possibilities.', 'Bắt đầu kết nối. Mở ra cơ hội.'), L('Get in touch to learn about the Leovian ecosystem or discuss your needs.', 'Liên hệ với Leovian để tìm hiểu về hệ sinh thái hoặc trao đổi nhu cầu của bạn.'), 3) + `<section class="sec"><div class="in"><div class="g2" style="gap:60px;margin-top:0"><div><span class="lab">${L('CONTACT DETAILS', 'THÔNG TIN LIÊN HỆ')}</span><h3 style="margin-top:10px">${L('Melbourne Office', 'Văn phòng Melbourne')}</h3><p>Ground Floor, 405 Collins Street, Melbourne VIC 3000, Australia</p><p>${L('Phone', 'Điện thoại')}: <a href="tel:+61405331876" style="color:var(--g2)">+61 405 331 876</a></p><p>Email: <a href="mailto:info@leovian.com.au" style="color:var(--g2)">info@leovian.com.au</a></p><p>Website: <a href="https://www.leovian.com.au" target="_blank" rel="noopener" style="color:var(--g2)">www.leovian.com.au</a></p></div><div><span class="lab">${L('SEND US A MESSAGE', 'GỬI LỜI NHẮN')}</span><br><br>${frm(F(L('Full name', 'Họ và tên'), 'n') + F('Email', 'e', 'email') + `<label>${L('Phone number (optional)', 'Số điện thoại (không bắt buộc)')}<input type="tel"></label><label>${L('Area of interest', 'Chủ đề quan tâm')}<select>${[['Education & Careers', 'Giáo dục & Nghề nghiệp'], ['Real Estate & Assets', 'Bất động sản & Tài sản'], ['Business Advisory & Startups', 'Tư vấn doanh nghiệp & Khởi nghiệp'], ['Other', 'Khác']].map(o => `<option>${L(o[0], o[1])}</option>`).join('')}</select></label><label>${L('Your message', 'Nội dung lời nhắn')}<textarea rows="4" required></textarea></label>`, L('Send Message', 'Gửi lời nhắn'))}</div></div></div></section>`;
        function nav() {
            $('#nav').innerHTML = `<a class="logo" href="#home">LEOVIAN</a><button class="mb" onclick="$('#nav').classList.toggle('open')" aria-label="Menu">☰</button><div class="nl">` + N.map(([k, e, v]) => k == 'ecosystem' ? `<div class="dd"><a href="#ecosystem" class="${page == k ? 'cur' : ''}">${L(e, v)} ▾</a><div class="menu"><div><b>${L('Investment', 'Đầu tư')}</b>${INV.map((x, i) => `<a href="#ecosystem" onclick="go('ecosystem','i${i}');return false">${L(x[0], x[1])}</a>`).join('')}</div><div><b>${L('Partnership', 'Đối tác')}</b>${PAR.map((x, i) => `<a href="#ecosystem" onclick="go('ecosystem','p${i}');return false">${L(x[0], x[1])}</a>`).join('')}</div></div></div>` : `<a href="#${k}" class="${page == k ? 'cur' : ''}">${L(e, v)}</a>`).join('') + `<span class="lg"><button class="${lang == 'en' ? 'on' : ''}" onclick="setLang('en')">EN</button> / <button class="${lang == 'vi' ? 'on' : ''}" onclick="setLang('vi')">VI</button></span></div>`;
            $('#talk').textContent = L('Talk to Our Team', 'Trò chuyện cùng đội ngũ'); $('#nt').textContent = L('Design Notes', 'Ghi chú thiết kế');
            $('#ft').innerHTML = L('Design prototype — all content, people, events and contact details are placeholders pending Leovian approval.', 'Bản thiết kế mẫu — mọi nội dung, nhân sự, sự kiện và thông tin liên hệ đều là minh họa, chờ Leovian xác nhận.')
        }
        function render(keep) {
            clearInterval(T1); clearInterval(T2); $('#nav').classList.remove('open'); $('#app').innerHTML = V[page](); nav(); document.documentElement.lang = lang;
            if (page == 'about') { ci = 0; if (!RM) T2 = setInterval(() => { hov || car(1) }, 6000) }
            if (page == 'home') rv(); if (!keep) { const e = sec && document.getElementById(sec); e ? e.scrollIntoView() : scrollTo(0, 0) } sec = null
        }
        function scene(i) { cur = i; document.querySelectorAll('.sc').forEach((e, j) => e.classList.toggle('on', j == i)); const p = document.querySelectorAll('.pi'); p.forEach(e => e.classList.remove('on')); void document.body.offsetWidth; p[i].classList.add('on'); const s = SC[i]; $('#cap').textContent = `LOOP 0${i + 1} — ${s[0]} / ${s[1]}. ${L(s[2], s[3])}`; clearInterval(T1); const pa = $('#hero').classList.contains('paused') || (RM && !$('#hero').dataset.go); if (!pa) T1 = setInterval(() => scene((cur + 1) % 4), 6000); ppl() }
        function ppl() { const h = $('#hero'); if (h && RM && !h.dataset.go) h.classList.add('paused'); $('#pp').textContent = h.classList.contains('paused') ? '▶ ' + L('Play', 'Phát') : '❚❚ ' + L('Pause', 'Dừng') }
        function pp() { const h = $('#hero'); h.dataset.go = 1; h.classList.toggle('paused'); scene(cur) }
        function car(d) { ci = (ci + d + 5) % 5; $('#tr').style.transform = `translateX(-${ci * 100}%)` }
        function ev(i) { const e = EV[i]; $('#dlg').innerHTML = `<span class="lab">${L(e[4], e[5])} · ${e[6]}</span><h3 style="margin:8px 0">${L(e[0], e[1])}</h3><p>${L(e[2], e[3])}</p><br><p style="font-size:13px">${L('Demonstration data — not a real Leovian event.', 'Dữ liệu minh họa — không phải sự kiện thật của Leovian.')}</p><br><button class="btn" onclick="$('#dlg').close()">${L('Close', 'Đóng')}</button>`; $('#dlg').showModal() }
        function go(p, s) { sec = s || null; document.activeElement.blur(); if (location.hash == '#' + p || (!location.hash && p == 'home')) render(); else location.hash = p }
        function setLang(l) { lang = l; const y = scrollY; render(1); scrollTo(0, y) }
        addEventListener('hashchange', () => { const h = location.hash.slice(1); page = V[h] ? h : 'home'; render() });
        document.addEventListener('submit', e => { e.preventDefault(); e.target.innerHTML = `<p class="ok">${L('Thank you. This is a prototype confirmation; no data was sent.', 'Cảm ơn bạn. Đây là xác nhận mô phỏng; không có dữ liệu nào được gửi.')}</p>` });
        $('#talk').onclick = () => go('contact'); $('#nt').onclick = () => { $('#nt').setAttribute('aria-pressed', document.body.classList.toggle('notes')) };
        page = V[location.hash.slice(1)] ? location.hash.slice(1) : 'home'; render();
    </script>
</body>

</html>
